# The check main's ruleset requires before a pull request merges. For now it lints the
# workflows, since a broken workflow here can stop releases being copied or signed. Language
# pack tests join this job when the packs' source moves into this repository.
name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint the workflows
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz | tar xz actionlint
          ./actionlint -color
