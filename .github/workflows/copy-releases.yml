# Copies every release (same tags, same signed files) from the add-on's
# first home on NoobyNull into this repository.
# Safe to run again: releases already here are skipped.
# It no longer copies the README: changes to this repository now come here
# as pull requests, and main's ruleset refuses direct pushes.
name: Copy releases
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write # creating releases
jobs:
  copy:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SRC: NoobyNull/CutCraft-Translations
    steps:
      - uses: actions/checkout@v4
      - name: Copy the releases
        run: |
          set -euo pipefail
          shopt -s nullglob
          for tag in $(gh release list -R "$SRC" --limit 100 --json tagName,createdAt -q 'sort_by(.createdAt) | .[].tagName'); do
            if gh release view "$tag" >/dev/null 2>&1; then echo "$tag is already here"; continue; fi
            rm -rf assets && mkdir assets
            gh release download "$tag" -R "$SRC" -D assets
            gh release view "$tag" -R "$SRC" --json name,body,isPrerelease > info.json
            jq -r .body info.json > notes.md
            pre=""
            if [ "$(jq -r .isPrerelease info.json)" = true ]; then pre="--prerelease"; fi
            gh release create "$tag" assets/* --target "$(git rev-parse HEAD)" --title "$(jq -r .name info.json)" --notes-file notes.md $pre
            echo "copied $tag"
          done
          # Releases copied in one run are published in the order copied, and GitHub calls
          # the last one published the latest, which is what PowerWhittle installs from. So
          # mark the source's latest as the latest here too.
          newest=$(gh release view -R "$SRC" --json tagName -q .tagName)
          if gh release view "$newest" >/dev/null 2>&1; then
            gh release edit "$newest" --latest
            echo "$newest is the latest"
          fi
